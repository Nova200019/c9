services:
  - type: web
    name: cloud9-ai-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DOCKER
        value: "true"
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cloud9-redis
          property: connectionString
      - key: DB_TYPE
        value: s3
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_HOST
        fromService:
          type: pserv
          name: ollama
          property: host
      - key: OLLAMA_PORT
        fromService:
          type: pserv
          name: ollama
          property: port
      - key: OLLAMA_TEXT_MODEL
        value: llama2:13b
      - key: OLLAMA_VISION_MODEL
        value: llava:13b
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: OLLAMA_REASONING_MODEL
        value: llama2:13b
      - key: OLLAMA_PULL_MODELS
        value: llama2:13b llava:13b nomic-embed-text
      - key: LOCAL_WHISPER_MODEL
        value: Xenova/whisper-medium.en
      - key: LOCAL_EMBED_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: STABLE_DIFFUSION_URL
        value: ""
      - key: COMFYUI_URL
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FS_DIRECTORY
        value: /data/
      - key: S3_ID
        sync: false
      - key: S3_KEY
        sync: false
      - key: S3_BUCKET
        value: mydrive
      - key: MINIO_HOST
        fromService:
          type: pserv
          name: minio
          property: host
      - key: MINIO_PORT
        fromService:
          type: pserv
          name: minio
          property: port
      - key: KEY
        sync: false
      - key: PASSWORD_ACCESS
        sync: false
      - key: PASSWORD_REFRESH
        sync: false
      - key: PASSWORD_COOKIE
        sync: false
      - key: VIDEO_THUMBNAILS_ENABLED
        value: "true"
      - key: TEMP_DIRECTORY
        value: /temp/
      - key: TEMP_VIDEO_THUMBNAIL_LIMIT
        value: "5000000000"
      - key: EMAIL_VERIFICATION
        value: "false"
      - key: EMAIL_DOMAIN
        value: gmail.com
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: in-v3.mailjet.com
      - key: REMOTE_URL
        value: https://cloud9ca3.azurewebsites.net
      - key: SECURE_COOKIES
        value: "true"
      - key: SSL
        value: "false"
      - key: HTTPS_KEY_PATH
        value: certificate.key
      - key: HTTPS_CA_PATH
        value: certificate.ca-bundle
      - key: HTTPS_CRT_PATH
        value: certificate.crt
      - key: TIER_FREE_MSG_LIMIT
        value: "50"
      - key: TIER_FREE_TOOL_LIMIT
        value: "10"
      - key: TIER_FREE_TOKEN_LIMIT
        value: "100000"
      - key: TIER_FREE_CODE_EXEC
        value: "false"
      - key: TIER_FREE_AGENTS
        value: "false"
      - key: TIER_PRO_MSG_LIMIT
        value: "500"
      - key: TIER_PRO_TOOL_LIMIT
        value: "200"
      - key: TIER_PRO_TOKEN_LIMIT
        value: "2000000"
      - key: TIER_PRO_CODE_EXEC
        value: "true"
      - key: TIER_PRO_AGENTS
        value: "true"
      - key: TIER_ENT_MSG_LIMIT
        value: "999999"
      - key: TIER_ENT_TOOL_LIMIT
        value: "999999"
      - key: TIER_ENT_TOKEN_LIMIT
        value: "50000000"
      - key: TIER_ENT_CODE_EXEC
        value: "true"
      - key: TIER_ENT_AGENTS
        value: "true"
      - key: TIER_ADMIN_MSG_LIMIT
        value: "999999"
      - key: TIER_ADMIN_TOOL_LIMIT
        value: "999999"
      - key: TIER_ADMIN_TOKEN_LIMIT
        value: "999999999"
      - key: TIER_ADMIN_CODE_EXEC
        value: "true"
      - key: TIER_ADMIN_AGENTS
        value: "true"
      - key: CLOUDFLARE_CDN_URL
        sync: false
      - key: USE_CDN_FOR_PUBLIC_FILES
        value: "true"

  - type: pserv
    name: mongo
    runtime: image
    image:
      url: mongo:8
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 10
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        value: abcd
      - key: MONGO_INITDB_ROOT_PASSWORD
        value: "1234"
      - key: MONGO_INITDB_DATABASE
        value: mydrive

  - type: pserv
    name: minio
    runtime: image
    image:
      url: minio/minio:latest
    dockerCommand: server /data --console-address ":9001"
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: MINIO_ROOT_USER
        value: minioadmin
      - key: MINIO_ROOT_PASSWORD
        value: minioadmin123

  - type: pserv
    name: ollama
    runtime: image
    image:
      url: ollama/ollama:latest
    dockerCommand: >
      /bin/sh -c "ollama serve & sleep 5 && ollama pull llama2:13b && ollama pull llava:13b && ollama pull nomic-embed-text && wait"
    disk:
      name: ollama-data
      mountPath: /root/.ollama
      sizeGB: 50

  - type: keyvalue
    name: cloud9-redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    plan: free
    maxmemoryPolicy: allkeys-lru
